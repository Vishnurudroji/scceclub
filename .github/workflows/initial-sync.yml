name: New Student Initial Sync

on:
  schedule:
    # 11:00 PM IST = 5:30 PM UTC
    - cron: "30 17 * * *"

  workflow_dispatch:

jobs:
  initial-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json

      - name: Run new student initial sync
        env:
          FIREBASE_SERVICE_ACCOUNT: firebase-service-account.json
        run: |
          python worker.py queue --type INITIAL_SYNC --limit 100

      - name: Remove credentials
        if: always()
        run: |
          rm -f firebase-service-account.json