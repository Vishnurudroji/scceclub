name: Daily Attendance Sync

on:
  schedule:
    # 6:00 PM IST = 12:30 PM UTC
    - cron: "30 12 * * *"

  workflow_dispatch:

jobs:
  daily-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json

      - name: Enqueue today's daily jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: firebase-service-account.json
        run: |
          python worker.py enqueue-daily

      - name: Process daily attendance
        env:
          FIREBASE_SERVICE_ACCOUNT: firebase-service-account.json
        run: |
          python worker.py queue --type DAILY_SYNC --limit 100

      - name: Remove credentials
        if: always()
        run: |
          rm -f firebase-service-account.json